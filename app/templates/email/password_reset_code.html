<!doctype html>
<html lang="{{ current_locale|replace('_', '-') }}" dir="{{ 'rtl' if current_locale == 'ar' else 'ltr' }}">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ _('Your NexHaat password reset code') }}</title></head>
<body style="margin:0;background:#f2f5f7;color:#172b36;font-family:Arial,sans-serif;padding:32px 16px">
  <main style="max-width:560px;margin:0 auto;background:#fff;border-radius:20px;padding:32px">
    <p style="color:#08765b;font-weight:700">{{ restaurant_name }}</p>
    <h1 style="font-size:24px">{{ _('Your NexHaat password reset code') }}</h1>
    <p>{{ _('Use this code to create a new NexHaat account password:') }}</p>
    <p style="font-size:32px;letter-spacing:.25em;font-weight:700;color:#08765b">{{ code }}</p>
    <p>{{ _('This code expires in 10 minutes. If you did not request this, you can ignore this email.') }}</p>
  </main>
</body>
</html>

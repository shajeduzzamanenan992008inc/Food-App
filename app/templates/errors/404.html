{% extends "auth/base.html" %}
{% block title %}{{ _('Page not found') }} · {{ app_name }}{% endblock %}
{% block auth_content %}
<section class="auth-panel auth-message" role="status" aria-labelledby="error-heading">
  <p class="eyebrow">{{ _('NEXHAAT MARKETPLACE') }}</p>
  <span class="auth-message__code" aria-hidden="true">404</span>
  <h1 id="error-heading">{{ _('Page not found') }}</h1>
  <p class="auth-subtitle">{{ _('The page you requested could not be found.') }}</p>
  <a class="auth-submit auth-message__link" href="{{ url_for('main.index') }}">{{ _('Return to home') }}</a>
</section>
{% endblock %}

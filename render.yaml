services:
  - type: web
    name: nexhaat
    runtime: python

    buildCommand: pip install -r requirements.txt && pybabel compile -d app/translations

    # Upgrade schema and initialize data before the new release serves traffic.
    preDeployCommand: flask db upgrade && flask ensure-admin && flask seed-catalog

    startCommand: gunicorn --workers 2 --threads 4 --timeout 120 "run:app"

    healthCheckPath: /health

    envVars:
      - key: APP_ENV
        value: production

      - key: SESSION_COOKIE_SECURE
        value: "true"

      - key: SECRET_KEY
        generateValue: true

      - key: PUBLIC_BASE_URL
        sync: false

      - key: BREVO_API_KEY
        sync: false

      - key: MAIL_DEFAULT_SENDER
        sync: false

      - key: DATABASE_URL
        fromDatabase:
          name: nexhaat-db
          property: connectionString


databases:
  - name: nexhaat-db
    databaseName: nexhaat
    user: nexhaat

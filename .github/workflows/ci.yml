# ──────────────────────────────────────────────────────────────
# NexHaat CI — Run the full test suite on every push & pull request
# ──────────────────────────────────────────────────────────────
name: CI — Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      FLASK_ENV: testing
      SECRET_KEY: ci-test-key-not-for-production
      DATABASE_URL: "sqlite:///test.db"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest -q --tb=short
